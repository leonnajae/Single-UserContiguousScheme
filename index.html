<html5-boiler>
<head>
    
    <title>Single-User Contiguous Scheme</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        padding: 20px;
      }

      .container {
        max-width: 900px;
        margin: auto;
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }

      h1, h2 {
        text-align: center;
      }

      label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border-radius: 5px;
        border: 1px solid #ccc;
      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        background-color: #007bff;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background-color: #0056b3;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      table, th, td {
        border: 1px solid #ccc;
      }

      th, td {
        padding: 10px;
        text-align: center;
      }

      .output {
        margin-top: 20px;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 10px;
        line-height: 1.8;
        font-size: 18px;
      }

      .success {
        color: green;
        font-weight: bold;
      }

      .failed {
        color: red;
        font-weight: bold;
      }

      .memory-box {
        margin-top: 20px;
        border: 2px solid black;
        height: 300px;
        display: flex;
        flex-direction: column;
      }

      .os {
        background: #ff9999;
        text-align: center;
        font-weight: bold;
      }

      .job {
        background: #99ccff;
        text-align: center;
        font-weight: bold;
      }

      .unused {
        background: #ccffcc;
        text-align: center;
        font-weight: bold;
        flex-grow: 1;
      }
    </style>
  </head>
  <body>

  <div class="container">

    <h1>Single-User Contiguous Scheme</h1>
    <h2>Leonna Jae</h2>

    <label>Memory Size (K):</label>
    <input type="number" id="memorySize">

    <label>OS Size (K):</label>
    <input type="number" id="osSize">

    <label>Number of Jobs:</label>
    <input type="number" id="jobCount">

    <button onclick="createInputs()">Create Job Inputs</button>

    <div id="jobInputs"></div>

    <button onclick="startSimulation()">Start Simulation</button>

    <div id="jobList"></div>

    <div id="memoryDisplay"></div>

    <div id="output" class="output"></div>

  </div>

  <script>

  let jobs = [];

  function createInputs() {
    const count = parseInt(document.getElementById('jobCount').value);
    const container = document.getElementById('jobInputs');

    container.innerHTML = '';

    for(let i = 0; i < count; i++) {
      container.innerHTML += `
        <label>Job ${i + 1} Name:</label>
        <input type="text" id="jobName${i}">

        <label>Job ${i + 1} Size (K):</label>
        <input type="number" id="jobSize${i}">
      `;
    }
  }

  function displayJobList() {

    let html = `
      <h2>Job List</h2>
      <table>
        <tr>
          <th>Job Name</th>
          <th>Job Size (K)</th>
        </tr>
    `;

    jobs.forEach(job => {
      html += `
        <tr>
          <td>${job.name}</td>
          <td>${job.size}</td>
        </tr>
      `;
    });

    html += `</table>`;

    document.getElementById('jobList').innerHTML = html;
  }

  function displayMemory(os, jobName, jobSize, unused) {

    const total = os + jobSize + unused;

    const osPercent = (os / total) * 100;
    const jobPercent = (jobSize / total) * 100;
    const unusedPercent = (unused / total) * 100;

    document.getElementById('memoryDisplay').innerHTML = `

      <h2>Memory Allocation</h2>

      <div class="memory-box">

        <div class="os" style="height:${osPercent}%">
          OS<br>${os}K
        </div>

        <div class="job" style="height:${jobPercent}%">
          ${jobName}<br>${jobSize}K
        </div>

        <div class="unused" style="height:${unusedPercent}%">
          Unused<br>${unused}K
        </div>

      </div>
    `;
  }

  async function startSimulation() {

    jobs = [];

    const memorySize = parseFloat(document.getElementById('memorySize').value);
    const osSize = parseFloat(document.getElementById('osSize').value);
    const count = parseInt(document.getElementById('jobCount').value);

    const output = document.getElementById('output');
    output.innerHTML = '';

    if(memorySize <= osSize) {
      alert('Memory size must be greater than OS size!');
      return;
    }

    for(let i = 0; i < count; i++) {

      const name = document.getElementById(`jobName${i}`).value;
      const size = parseFloat(document.getElementById(`jobSize${i}`).value);

      jobs.push({ name, size });
    }

    displayJobList();

    let availableMemory = memorySize - osSize;

    let success = 0;
    let failed = 0;
    let failedJobs = [];

    for(let job of jobs) {

      output.innerHTML += `
        <h3>Allocating Memory for ${job.name}...</h3>
      `;

      if(job.size <= availableMemory) {

        let unused = availableMemory - job.size;

        displayMemory(osSize, job.name, job.size, unused);

        output.innerHTML += `
          <ul>
            <li>
              <strong>OS (${osSize}k), ${job.name} (${job.size}k), Unused (${unused}k)</strong>
            </li>
          </ul>

          <div class="success">
            Memory for ${job.name} was successfully allocated.
          </div>
        `;

        success++;

        await waitForContinue();

        let answer = prompt('Memory is handling a job! Deallocate (Y/N)').toUpperCase();

        output.innerHTML += `
          <br>
          Memory is handling a job! Deallocate (Y/N) <strong>${answer}</strong>
          <br><br>
        `;

        if(answer === 'Y') {
          output.innerHTML += `
            <div class="success">
              ${job.name} deallocated successfully.
            </div>
            <br>
          `;
        }

      }
      else {

        output.innerHTML += `
          <div class="failed">
            Insufficient Memory!!!
          </div>
        `;

        failed++;
        failedJobs.push(job.name);

        await waitForContinue();
      }
    }

    output.innerHTML += `

      <h2 style="color:red;">CONCLUSION:</h2>

      <ul>
        <li><strong>${success} Jobs were successfully processed/executed.</strong></li>
        <li><strong>${failed} job failed to load - ${failedJobs.join(', ') || 'None'}.</strong></li>
      </ul>
    `;
  }

  function waitForContinue() {

    return new Promise(resolve => {

      setTimeout(() => {
        alert('Press OK to Continue...');
        resolve();
      }, 500);

    });
  }

  </script>

  </body>
  </html5-boiler>
